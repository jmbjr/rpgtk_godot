name: Check viewer and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check viewer modules and command catalog
        run: |
          node --check app.mjs
          node --check archive.mjs
          node --check model.mjs
          node --check asset-format.mjs
          node --check artifacts.mjs
          node --check records.mjs
          node --check game-graph.mjs
          node --check inspector-history.mjs
          node --check media.mjs
          node --check midi.mjs
          node --check piano-roll.mjs
          node --check scripts/stage-piano-roll.mjs
          node --check scripts/stage-soundfont.mjs
          node --check vendor/webaudio-tinysynth.js
          node --check sprites.mjs
          node --check tile-pdf.mjs
          node --check scripts/smoke.mjs
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { indexProgram } from "./model.mjs";
          const catalog = JSON.parse(readFileSync("catalog.json", "utf8"));
          const script = '#SetButton("new.jpg",0,0,0,10,10)\n* #MidiPlay("example.mid")\n#if (opt!=2) {#dos}';
          const result = indexProgram(script, catalog);
          assert.equal(catalog.setbutton.feature, "SCR-07");
          assert.equal(result.count, 3);
          assert.deepEqual(result.groups.get("builtin:setbutton").lines, [1]);
          assert.deepEqual(result.groups.get("builtin:dos").lines, [3]);
          assert.equal(result.rows[1].tokens[0].kind, "comment");
          JS
      - name: Check game archive imports
        run: node scripts/check-game-archive.mjs
      - name: Check format conformance
        run: |
          node scripts/check-tile-specs.mjs
          node scripts/check-format-specs.mjs
          node scripts/check-asset-formats.mjs
          node scripts/check-bstw-gam-29.mjs
          node scripts/check-bstw-board-24.mjs
          node scripts/check-bstw-tem-anm.mjs
          node scripts/check-companion-media.mjs
          node scripts/check-character-board-details.mjs
          node scripts/check-visual-diagnostics.mjs
          node scripts/check-tile-matches.mjs
          node scripts/check-game-graph.mjs
          node scripts/check-inspector-history.mjs
          node scripts/check-connection-map.mjs
      - name: Check tileset PDF export
        run: node scripts/check-tileset-pdf.mjs
      - name: Stage public viewer files
        run: |
          mkdir -p site/vendor
          cp .nojekyll index.html style.css app.mjs archive.mjs model.mjs artifacts.mjs asset-format.mjs tile-palette.mjs records.mjs game-graph.mjs inspector-history.mjs connection-map.mjs media.mjs midi.mjs piano-roll.mjs sprites.mjs tile-matches.mjs tile-pdf.mjs catalog.json site/
          cp vendor/jszip.min.js vendor/JSZip-LICENSE.md vendor/webaudio-tinysynth.js vendor/TinySynth-LICENSE.txt site/vendor/
          cp -R vendor/soundfont vendor/generaluser-gs vendor/piano-roll vendor/jspdf site/vendor/
          cp --parents experiments/dodge-tiles/{project,card-scene}.mjs site/
      - name: Build and verify Toolkit 2 test games
        run: |
          node scripts/build-tk2-test-game.mjs site/tk2-test-game.zip
          node scripts/build-tk2-test-game.mjs site/tk2-legacy-game.zip --legacy
          node scripts/build-tk2-test-game.mjs site/tk2-text-gam-game.zip --text-gam
      - name: Build and verify synthetic CMP1 wrapper
        run: node scripts/build-tk2-installer-fixture.mjs site/tk2-legacy-game.zip dist/tk2-legacy-cmp1-test-wrapper.zip
      - name: Compare alternate GAM and validate all 57 matrix rows
        run: |
          node scripts/check-alternate-gam.mjs site/tk2-legacy-game.zip site/tk2-text-gam-game.zip
          node scripts/check-legacy-coverage-audit.mjs site/tk2-legacy-game.zip site/tk2-text-gam-game.zip dist/tk2-legacy-cmp1-test-wrapper.zip dist/tk2-coverage-audit-results.json
      - name: Upload alternate text GAM game for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tk2-text-gam-game
          path: site/tk2-text-gam-game.zip
          if-no-files-found: error
      - name: Upload matrix evidence audit for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tk2-coverage-audit
          path: dist/tk2-coverage-audit-results.json
          if-no-files-found: error
      - name: Upload synthetic CMP1 wrapper for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tk2-legacy-cmp1-wrapper
          path: dist/tk2-legacy-cmp1-test-wrapper.zip
          if-no-files-found: error
      - name: Upload test game for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tk2-test-game
          path: site/tk2-test-game.zip
          if-no-files-found: error
      - name: Upload legacy format coverage game for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tk2-legacy-game
          path: site/tk2-legacy-game.zip
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
