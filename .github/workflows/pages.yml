name: Check viewer and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check viewer modules and command catalog
        run: |
          node --check app.mjs
          node --check model.mjs
          node --check artifacts.mjs
          node --check records.mjs
          node --check media.mjs
          node --check sprites.mjs
          node --check scripts/smoke.mjs
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { indexProgram } from "./model.mjs";
          const catalog = JSON.parse(readFileSync("catalog.json", "utf8"));
          const script = '#SetButton("new.jpg",0,0,0,10,10)\n* #MidiPlay("example.mid")\n#if (opt!=2) {#dos}';
          const result = indexProgram(script, catalog);
          assert.equal(catalog.setbutton.feature, "SCR-07");
          assert.equal(result.count, 3);
          assert.deepEqual(result.groups.get("builtin:setbutton").lines, [1]);
          assert.deepEqual(result.groups.get("builtin:dos").lines, [3]);
          assert.equal(result.rows[1].tokens[0].kind, "comment");
          JS
      - name: Stage public viewer files
        run: |
          mkdir -p site/vendor
          cp .nojekyll index.html style.css app.mjs model.mjs artifacts.mjs records.mjs media.mjs sprites.mjs catalog.json site/
          cp vendor/jszip.min.js vendor/JSZip-LICENSE.md site/vendor/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
